[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecommerce_customer_value_prediction"
version = "0.1.0"
description = "E-Commerce Customer Value Prediction using RFM features and Ridge regression."
authors = [
  { name = "Pritam Singh" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "ipython",
    "jupyterlab",
    "loguru",
    "matplotlib",
    "notebook",
    "numpy",
    "openpyxl",
    "pandas",
    "pip",
    "python-dotenv",
    "scikit-learn",
    "seaborn",
    "tqdm",
    "typer",
]
requires-python = ">=3.10"

[project.scripts]
clean-data  = "ecommerce_customer_value_prediction.data.clean_data:app"
train       = "ecommerce_customer_value_prediction.pipelines.training_pipeline:app"

[tool.setuptools]
# Map the ecommerce_customer_value_prediction import name to the src/ directory
package-dir = {"ecommerce_customer_value_prediction" = "src"}

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 99
src = ["src"]
include = ["pyproject.toml", "src/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.lint.isort]
known-first-party = ["ecommerce_customer_value_prediction"]
force-sort-within-sections = true
